services:
  # 1. Backend API & Real-Time WebSocket Server
  - type: web
    name: auction-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Provide your MongoDB Atlas replica set URI in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ANTI_SNIPING_THRESHOLD_SECONDS
        value: "120"
      - key: ANTI_SNIPING_EXTENSION_SECONDS
        value: "120"
      - key: SCHEDULER_INTERVAL_MS
        value: "5000"

  # 2. Frontend Single Page Application (Vite + React)
  - type: web
    name: auction-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: auction-backend
          property: host
